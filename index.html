<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bad Batches: US food recall map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="map-stage" id="map-stage">
  <svg viewBox="-68 2 1036 614" id="map-svg" aria-label="Map of US states, click a state to see its recalls"></svg>
</div>

<div class="overlay-card title-card">
  <div>
    <h1>Bad Batches</h1>
    <p>Check for any recalls/warnings in your state</p>
  </div>
</div>

<div class="overlay-card toolbar-card">
  <button class="toolbar-btn is-active" data-window="60">Last 60 days</button>
  <button class="toolbar-btn" data-window="all">Full history</button>
  <div class="toolbar-divider"></div>
  <label class="toolbar-toggle">
    <input type="checkbox" id="region-toggle">
    Regions
  </label>
</div>

<div class="overlay-card legend-card">
  <span class="legend-title">Recall severity</span>
  <span class="legend-item"><i class="swatch swatch-1"></i>Class I, serious risk</span>
  <span class="legend-item"><i class="swatch swatch-2"></i>Class II, moderate risk</span>
  <span class="legend-item"><i class="swatch swatch-3"></i>Class III, low risk</span>
  <span class="legend-item"><i class="swatch swatch-none"></i>No recalls in window</span>
</div>

<div class="credit-line" id="last-updated">Loading recall data&hellip;</div>

<div class="overlay-card detail-card" id="detail-card">
  <button class="detail-close" id="detail-close">&times;</button>
  <span class="detail-close-hint">or press E</span>
  <h2 id="detail-state-name">State</h2>
  <p class="detail-count" id="detail-count"></p>
  <div id="recall-list"></div>
</div>

<div class="recall-modal" id="recall-modal" hidden>
  <div class="recall-modal-backdrop" id="recall-modal-backdrop"></div>
  <div class="recall-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="recall-modal-close" id="recall-modal-close" aria-label="Close">&times;</button>
    <span class="modal-source" id="modal-source"></span>
    <h3 id="modal-title"></h3>
    <dl class="modal-fields" id="modal-fields"></dl>
    <div class="modal-states">
      <span class="modal-states-label">Also distributed to</span>
      <div id="modal-states-list"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
